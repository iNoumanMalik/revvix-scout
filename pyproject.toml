[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "revvix-scout"
version = "0.1.0"
description = "Evidence-backed, free-first lead intelligence for Revvix AI."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Revvix AI" }]
dependencies = [
  "alembic==1.16.2",
  "fastapi==0.115.12",
  "pydantic==2.11.7",
  "pydantic-settings==2.9.1",
  "psycopg[binary]==3.2.9",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.41",
  "tldextract==5.3.0",
  "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.16.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.1",
]

[project.scripts]
revvix-scout = "revvix_scout.main:run"
revvix-scout-worker = "revvix_scout.worker:run"

[tool.hatch.build.targets.wheel]
packages = ["src/revvix_scout"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["revvix_scout"]

